services:
  ukrmedia-nlp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PRELOAD_MODELS: "false"
    container_name: ukrmedia-nlp-app
    ports:
      - "8501:8501"
    restart: unless-stopped
    mem_limit: 2g
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - HF_HOME=/app/.cache/huggingface
      - ARTICLE_CACHE_DIR=/app/.cache/articles
      - SPACY_MODEL=uk_core_news_sm
      - ALLOW_HEAVY_NLP=${ALLOW_HEAVY_NLP:-0}
    volumes:
      - hf_cache:/app/.cache/huggingface
      - article_cache:/app/.cache/articles

  ukrmedia-nlp-full:
    profiles: ["full-nlp"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PRELOAD_MODELS: "false"
    container_name: ukrmedia-nlp-full
    ports:
      - "8501:8501"
    restart: unless-stopped
    mem_limit: 4g
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - HF_HOME=/app/.cache/huggingface
      - ARTICLE_CACHE_DIR=/app/.cache/articles
      - SPACY_MODEL=uk_core_news_sm
      - ALLOW_HEAVY_NLP=1
    volumes:
      - hf_cache:/app/.cache/huggingface
      - article_cache:/app/.cache/articles

  ukrmedia-nlp-md:
    profiles: ["spacy-md"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PRELOAD_MODELS: "false"
        SPACY_MODEL: uk_core_news_md
    container_name: ukrmedia-nlp-md
    ports:
      - "8502:8501"
    restart: unless-stopped
    mem_limit: 3g
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - HF_HOME=/app/.cache/huggingface
      - ARTICLE_CACHE_DIR=/app/.cache/articles
      - SPACY_MODEL=uk_core_news_md
      - ALLOW_HEAVY_NLP=${ALLOW_HEAVY_NLP:-0}
    volumes:
      - hf_cache:/app/.cache/huggingface
      - article_cache:/app/.cache/articles

  nginx:
    profiles: ["with-nginx"]
    image: nginx:1.27-alpine
    container_name: ukrmedia-nlp-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ukrmedia-nlp

volumes:
  hf_cache:
  article_cache:
