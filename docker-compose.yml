services:
  postgres:
    image: postgres:16-alpine
    container_name: ukrmedia-nlp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ukrmedia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ukrmedia}
      POSTGRES_DB: ${POSTGRES_DB:-ukrmedia}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ukrmedia} -d ${POSTGRES_DB:-ukrmedia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ukrmedia-nlp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PRELOAD_MODELS: "false"
    container_name: ukrmedia-nlp-app
    ports:
      - "8501:8501"
    restart: unless-stopped
    mem_limit: 2g
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - HF_HOME=/app/.cache/huggingface
      - ARTICLE_CACHE_DIR=/app/.cache/articles
      - SPACY_MODEL=uk_core_news_sm
      - ALLOW_HEAVY_NLP=${ALLOW_HEAVY_NLP:-0}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://ukrmedia:ukrmedia@postgres:5432/ukrmedia}
    volumes:
      - hf_cache:/app/.cache/huggingface
      - article_cache:/app/.cache/articles
    depends_on:
      postgres:
        condition: service_healthy

  ukrmedia-nlp-full:
    profiles: ["full-nlp"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PRELOAD_MODELS: "false"
    container_name: ukrmedia-nlp-full
    ports:
      - "8501:8501"
    restart: unless-stopped
    mem_limit: 4g
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - HF_HOME=/app/.cache/huggingface
      - ARTICLE_CACHE_DIR=/app/.cache/articles
      - SPACY_MODEL=uk_core_news_sm
      - ALLOW_HEAVY_NLP=1
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://ukrmedia:ukrmedia@postgres:5432/ukrmedia}
    volumes:
      - hf_cache:/app/.cache/huggingface
      - article_cache:/app/.cache/articles
    depends_on:
      postgres:
        condition: service_healthy

  ukrmedia-nlp-md:
    profiles: ["spacy-md"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PRELOAD_MODELS: "false"
        SPACY_MODEL: uk_core_news_md
    container_name: ukrmedia-nlp-md
    ports:
      - "8502:8501"
    restart: unless-stopped
    mem_limit: 3g
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - HF_HOME=/app/.cache/huggingface
      - ARTICLE_CACHE_DIR=/app/.cache/articles
      - SPACY_MODEL=uk_core_news_md
      - ALLOW_HEAVY_NLP=${ALLOW_HEAVY_NLP:-0}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://ukrmedia:ukrmedia@postgres:5432/ukrmedia}
    volumes:
      - hf_cache:/app/.cache/huggingface
      - article_cache:/app/.cache/articles
    depends_on:
      postgres:
        condition: service_healthy

  ingest:
    profiles: ["ingest"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PRELOAD_MODELS: "false"
    container_name: ukrmedia-nlp-ingest
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://ukrmedia:ukrmedia@postgres:5432/ukrmedia}
      - HF_HOME=/app/.cache/huggingface
      - ARTICLE_CACHE_DIR=/app/.cache/articles
      - SPACY_MODEL=uk_core_news_sm
    volumes:
      - hf_cache:/app/.cache/huggingface
      - article_cache:/app/.cache/articles
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "corpus_store.ingest", "--all"]

  nginx:
    profiles: ["with-nginx"]
    image: nginx:1.27-alpine
    container_name: ukrmedia-nlp-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ukrmedia-nlp

volumes:
  hf_cache:
  article_cache:
  postgres_data:
