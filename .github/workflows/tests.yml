name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ukrmedia
          POSTGRES_PASSWORD: ukrmedia
          POSTGRES_DB: ukrmedia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ukrmedia -d ukrmedia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          python -m spacy download uk_core_news_sm

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg://ukrmedia:ukrmedia@localhost:5432/ukrmedia
        run: python -m alembic upgrade head

      - name: Run unit tests with coverage
        env:
          ARTICLE_CACHE: "0"
          TEST_DATABASE_URL: postgresql+psycopg://ukrmedia:ukrmedia@localhost:5432/ukrmedia
        run: pytest -m "not slow" --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

      - name: Lint with ruff
        run: ruff check .

  cloud-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install cloud (light) dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt
          pip install -r requirements-dev.txt
          python -m spacy download uk_core_news_sm

      - name: Run unit tests without transformers
        env:
          ARTICLE_CACHE: "0"
          LIGHT_CLOUD: "1"
        run: pytest -m "not slow and not postgres" -q --cov=. --cov-fail-under=50

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker compose build

      - name: Smoke healthcheck
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              echo "healthy"
              docker compose down
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          docker compose down
          exit 1
