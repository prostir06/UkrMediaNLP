name: Scraper Health

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  scrape-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scrape dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scrape.txt

      - name: Run scraper smoke test
        env:
          ARTICLE_CACHE: "0"
        run: python scripts/scraper_health_check.py
