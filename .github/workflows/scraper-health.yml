name: Scraper Health

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: "Run against all NEWS_SOURCES (live full)"
        type: boolean
        default: false

jobs:
  scrape-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install scrape dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scrape.txt

      - name: Run scraper smoke test
        env:
          ARTICLE_CACHE: "0"
          # Scheduled runs stay on the fixture subset; full live only via dispatch.
          SCRAPER_HEALTH_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full && '1' || '0' }}
        run: python scripts/scraper_health_check.py
